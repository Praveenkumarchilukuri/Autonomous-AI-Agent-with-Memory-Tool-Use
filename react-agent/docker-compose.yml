version: "3.9"

services:
  api:
    build: .
    container_name: react-agent-api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - faiss-data:/app/faiss_store
      - ./evaluation/results:/app/evaluation/results
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ui:
    build: .
    container_name: react-agent-ui
    ports:
      - "7860:7860"
    env_file: .env
    volumes:
      - faiss-data:/app/faiss_store
    command: python gradio_app/app.py
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  faiss-data:
