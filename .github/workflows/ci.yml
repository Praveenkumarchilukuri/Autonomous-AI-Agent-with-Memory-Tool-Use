name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check . --select E,W,F --ignore E501,F401

      - name: Run unit tests
        env:
          GEMINI_API_KEY: test_placeholder
          TAVILY_API_KEY: test_placeholder
          FAISS_PERSIST_PATH: /tmp/faiss_ci
        run: |
          pytest tests/ -v \
            --cov=. --cov-report=xml --cov-report=term-missing \
            -k "not integration"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t react-agent:ci .
      - name: Smoke test
        run: |
          docker run --rm \
            -e GEMINI_API_KEY=test \
            -e TAVILY_API_KEY=test \
            react-agent:ci \
            python -c "from config import settings; from tools.executor import ToolExecutor; print('OK')"
